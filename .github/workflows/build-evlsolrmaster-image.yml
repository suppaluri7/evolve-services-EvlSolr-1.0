name: Build EvlSolrMaster Image

# Ticket: NHETIO-4440 — GHA Build Docker Application Image (EvlSolrMaster)
#
# Scope: "Build Application Image" — consumes the EvlSolrMaster binary tar
#   produced by the NHETIO-4435 binary workflow, runs docker build with
#   master/Dockerfile, and pushes the resulting Application Image to the
#   JFrog Artifactory Docker registry.
#   ECR push is out of scope for this POC.
#
# Prerequisites:
#   - NHETIO-4435 workflow has produced EvlSolrMaster-<ver>-<num>.tar in
#     generic-evolve-services-dev-local/POC/GHA/elsevier-health/...
#   - Identity mapping approved for evolve-gha-poc OIDC provider
#     (artifactory-evolve-bo-generic-users)
#
# Auth: JFrog OIDC (id-token: write) — no stored secrets needed.
#   oidc-user / oidc-token outputs used for:
#     1. docker/login-action → authenticate docker daemon to JFrog registry
#     2. CURL_OPTS build-arg → authenticate curl inside docker build layers
#        Note: OIDC token is short-lived; for production use Docker BuildKit
#        --secret to avoid token appearing in docker history.
#
# ── POC isolation ─────────────────────────────────────────────────────────────
# Images pushed under: <registry>/poc/elsevier-health/evlsolrmaster:<tag>
# Production path would be: <registry>/elsevier-health/evlsolrmaster:<tag>
# POC images can be bulk-deleted from the poc/ prefix when the POC is done.

"on":
  workflow_dispatch:
    inputs:
      artifact_version:
        description: 'Binary version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      artifact_build_num:
        description: 'Build number of EvlSolrMaster tar (e.g. 4  — from NHETIO-4435 run)'
        required: true
      solr_env:
        description: 'Solr environment config to embed in image'
        required: false
        default: 'prod'
        type: choice
        options:
          - dev
          - cert
          - stage
          - prod

permissions:
  contents: read
  id-token: write

env:
  # docker-evolve-bo-services-releases-local is the confirmed-live Docker registry
  # (same as used by evolve-services-EvolveEcom-2.0 reference workflow).
  # POC images are pushed under poc/<owner>/ to avoid any collision with release images.
  REGISTRY: docker-evolve-bo-services-releases-local.health.artifactory.tio.systems
  JFROG_URL: https://health.artifactory.tio.systems/
  JFROG_OIDC_PROVIDER: artifactory-evolve-bo-generic-users
  JFROG_OIDC_AUDIENCE: artifactory-evolve-bo-generic-users
  ARTIFACTORY_GENERIC: https://health.artifactory.tio.systems/artifactory
  ARTIFACTORY_BINARY_REPO: generic-evolve-services-dev-local
  APP_NAME: EvlSolrMaster
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-image:
    name: Build & push Application Image (EvlSolrMaster)
    runs-on:
      group: elsevier-standard-runners
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_url: ${{ steps.report.outputs.image_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JFrog CLI
        id: artifactory
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.JFROG_URL }}
        with:
          oidc-provider-name: ${{ env.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ env.JFROG_OIDC_AUDIENCE }}
          disable-auto-build-publish: true

      - name: Log in to JFrog Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.artifactory.outputs.oidc-user }}
          password: ${{ steps.artifactory.outputs.oidc-token }}

      - name: Resolve binary artifact URL
        id: artifact
        run: |
          VER="${{ inputs.artifact_version }}"
          NUM="${{ inputs.artifact_build_num }}"
          RELEASE_ID="${APP_NAME}-${VER}-${NUM}"
          ARTIFACT_URL="${ARTIFACTORY_GENERIC}/${ARTIFACTORY_BINARY_REPO}/POC/GHA/${{ github.repository_owner }}/EvolveEcom/EvlSolr/${APP_NAME}/${VER}/${RELEASE_ID}.tar"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact_url=${ARTIFACT_URL}" >> "$GITHUB_OUTPUT"
          echo "Consuming binary: ${ARTIFACT_URL}"
          # Verify artifact exists before starting docker build
          jf rt ping
          jf rt search "${ARTIFACTORY_BINARY_REPO}/POC/GHA/${{ github.repository_owner }}/EvolveEcom/EvlSolr/${APP_NAME}/${VER}/${RELEASE_ID}.tar" \
            | grep -q "${RELEASE_ID}" \
            || { echo "ERROR: Artifact not found in Artifactory — run NHETIO-4435 workflow first"; exit 1; }

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/poc/${{ github.repository_owner }}/evlsolrmaster
          tags: |
            type=raw,value=${{ inputs.artifact_version }}-${{ inputs.artifact_build_num }}
            type=raw,value=latest

      - name: Build & push Application Image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: master/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EVLSOLRMASTER_ARTIFACT_URL=${{ steps.artifact.outputs.artifact_url }}
            CURL_OPTS=-u ${{ steps.artifactory.outputs.oidc-user }}:${{ steps.artifactory.outputs.oidc-token }}
            SOLR_ENV=${{ inputs.solr_env }}

      - name: Report image location
        id: report
        run: |
          IMAGE_URL="${REGISTRY}/poc/${{ github.repository_owner }}/evlsolrmaster:${{ inputs.artifact_version }}-${{ inputs.artifact_build_num }}"
          echo "image_url=${IMAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "Published: ${IMAGE_URL}"
          echo "Digest:    ${{ steps.push.outputs.digest }}"
